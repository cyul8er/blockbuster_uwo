<section class = "question">
    <h1>Contact Us</h1>
    <embed src="https://docs.google.com/forms/d/e/1FAIpQLSeJM_xjdDOYN10mJrY1JBfgLejS-5edjRHkSMscHpQ1hzFI3g/viewform?usp=publish-editor" class = "formEmbed">
</section>

<section class = "contactForm">
<form class="contactForm">

    <div class="inputRow">

        <div class="inputGroup">
            <label for="firstName">
                First Name
            </label>

            <input
                type="text"
                id="firstName"
                name="firstName"
                required
            >
        </div>

        <div class="inputGroup">
            <label for="lastName">
                Last Name
            </label>

            <input
                type="text"
                id="lastName"
                name="lastName"
                required
            >
        </div>

    </div>

    <div class="inputGroup">
        <label for="email">
            Email
        </label>

        <input
            type="email"
            id="email"
            name="email"
            required
        >
    </div>

    <div class="inputGroup">
        <label for="subject">
            Subject
        </label>

        <input
            type="text"
            id="subject"
            name="subject"
            required
        >
    </div>

    <div class="inputGroup">
        <label for="message">
            Message
        </label>

        <textarea
            id="message"
            name="message"
            rows="8"
            required
        ></textarea>
    </div>

    <button type="submit">
        Send
    </button>

</form>

    
</section>
</body>
